<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server 服务日志</title>
  <style>
    :root { color-scheme: dark; --bg: #07101f; --panel: #0b1628; --line: #26354e; --muted: #94a3b8; --dim: #64748b; --text: #dbeafe; --strong: #f8fafc; --blue: #38bdf8; --green: #22c55e; --orange: #f59e0b; --red: #ef4444; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, rgba(56, 189, 248, .08), transparent 34%), var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #1e293b; background: rgba(7, 16, 31, .94); backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
    button, select, a { min-height: 34px; padding: 7px 11px; border: 1px solid #334155; border-radius: 8px; background: #111c2f; color: var(--text); font: inherit; font-size: 12px; text-decoration: none; }
    button { cursor: pointer; }
    button:hover, select:hover, a:hover { border-color: var(--blue); }
    main { width: min(1580px, calc(100% - 28px)); margin: 16px auto 40px; }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .status::before { width: 8px; height: 8px; border-radius: 50%; background: var(--red); content: ""; }
    .status.is-online::before { background: var(--green); box-shadow: 0 0 12px rgba(34, 197, 94, .65); }
    .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .summary span { padding: 5px 8px; border: 1px solid rgba(148, 163, 184, .16); border-radius: 999px; background: rgba(15, 23, 42, .48); }
    .queue-panel { margin-bottom: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(135deg, #0d1b31, #0a1424); box-shadow: 0 10px 34px rgba(0, 0, 0, .16); }
    .queue-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .queue-heading h2 { margin: 0; color: var(--strong); font-size: 14px; }
    .queue-heading p { margin: 4px 0 0; color: var(--dim); font-size: 11px; }
    .queue-heading-meta { display: flex; align-items: center; gap: 8px; }
    .queue-limit { padding: 5px 8px; border: 1px solid #334155; border-radius: 999px; color: #bfdbfe; font: 11px Consolas, monospace; }
    .queue-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
    .queue-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid #1e293b; border-radius: 8px; background: rgba(15, 23, 42, .72); }
    .queue-stat span { color: var(--muted); font-size: 11px; }
    .queue-stat strong { color: var(--strong); font: 800 16px Consolas, monospace; }
    .queue-lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .queue-lane { min-width: 0; padding: 10px; border: 1px solid #1e293b; border-radius: 9px; background: rgba(5, 11, 22, .44); }
    .queue-lane[data-state="running"] { border-color: rgba(34, 197, 94, .35); }
    .queue-lane[data-state="waiting"] { border-color: rgba(245, 158, 11, .35); }
    .queue-lane-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: #cbd5e1; font-size: 11px; font-weight: 800; }
    .queue-lane-heading span { color: var(--dim); font: 10px Consolas, monospace; }
    .queue-task-list { display: grid; gap: 6px; }
    .queue-task { padding: 8px 9px; border-left: 3px solid var(--dim); border-radius: 7px; background: #101c30; }
    .queue-task[data-state="running"] { border-left-color: var(--green); }
    .queue-task[data-state="waiting"] { border-left-color: var(--orange); }
    .queue-task-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .queue-task-type { color: var(--strong); font-size: 11px; font-weight: 800; }
    .queue-task-number { color: var(--dim); font: 10px Consolas, monospace; }
    .queue-task-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font: 10px/1.4 Consolas, monospace; }
    .queue-task-meta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-task-empty { padding: 12px 6px; color: #475569; font-size: 11px; text-align: center; }
    .service-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .service-panel { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-top: 3px solid var(--accent, var(--blue)); border-radius: 14px; background: rgba(11, 22, 40, .92); box-shadow: 0 10px 30px rgba(0, 0, 0, .12); }
    .service-panel[data-empty="true"] { opacity: .68; }
    .service-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 12px 13px; border-bottom: 1px solid #1e293b; background: rgba(16, 28, 48, .84); }
    .service-head h2 { margin: 0; color: var(--strong); font-size: 14px; }
    .service-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .service-count { flex: 0 0 auto; padding: 4px 8px; border: 1px solid rgba(148, 163, 184, .18); border-radius: 999px; color: #cbd5e1; font: 11px Consolas, monospace; }
    .service-body { display: grid; gap: 8px; max-height: 560px; overflow: auto; padding: 10px; }
    .log-card { display: grid; gap: 8px; padding: 10px; border: 1px solid rgba(148, 163, 184, .14); border-left: 3px solid var(--accent, var(--blue)); border-radius: 10px; background: rgba(5, 11, 22, .58); }
    .log-card.is-error { border-left-color: var(--red); }
    .log-card.is-warning { border-left-color: var(--orange); }
    .log-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
    .log-title { min-width: 0; color: var(--strong); font-size: 12px; font-weight: 800; line-height: 1.45; word-break: break-word; }
    .log-time { color: var(--dim); font: 10px Consolas, monospace; white-space: nowrap; }
    .detail-button { justify-self: start; min-height: 26px; padding: 4px 8px; border-color: rgba(56, 189, 248, .28); background: rgba(56, 189, 248, .08); color: #bae6fd; }
    .log-card:hover .detail-button { border-color: rgba(56, 189, 248, .72); }
    .route-line { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border-radius: 8px; background: rgba(15, 23, 42, .62); }
    .route-node { min-width: 0; overflow: hidden; color: #bfdbfe; font: 11px/1.4 Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .route-arrow { color: var(--accent, var(--blue)); font-size: 13px; font-weight: 900; }
    .facts { display: flex; flex-wrap: wrap; gap: 6px; }
    .fact { max-width: 100%; overflow: hidden; padding: 4px 7px; border: 1px solid rgba(148, 163, 184, .16); border-radius: 7px; color: #cbd5e1; font: 10px/1.35 Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .fact.is-error { border-color: rgba(239, 68, 68, .34); color: #fca5a5; }
    pre { max-height: 260px; margin: 8px 0 0; overflow: auto; padding: 10px; border-radius: 7px; background: #050b16; color: #bfdbfe; font: 11px/1.55 Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
    .empty { padding: 32px 12px; color: #475569; font-size: 12px; text-align: center; }
    .log-inspector { position: fixed; right: 18px; bottom: 18px; z-index: 30; display: grid; width: min(980px, calc(100vw - 36px)); max-height: min(760px, calc(100vh - 36px)); overflow: hidden; border: 1px solid #3b4b63; border-top: 3px solid var(--blue); border-radius: 16px; background: #081223; box-shadow: 0 24px 80px rgba(0, 0, 0, .42); }
    .log-inspector[hidden] { display: none; }
    .inspector-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 14px; border-bottom: 1px solid #1e293b; background: #101c30; }
    .inspector-title { margin: 0; color: var(--strong); font-size: 14px; line-height: 1.45; }
    .inspector-subtitle { margin-top: 4px; color: var(--muted); font: 11px Consolas, monospace; }
    .inspector-close { min-width: 34px; padding: 5px 9px; font-size: 16px; line-height: 1; }
    .inspector-body { display: grid; gap: 12px; overflow: auto; padding: 12px 14px 14px; }
    .inspector-route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border: 1px solid rgba(148, 163, 184, .14); border-radius: 10px; background: rgba(15, 23, 42, .72); }
    .inspector-section { display: grid; gap: 8px; }
    .inspector-section h3 { margin: 0; color: #e2e8f0; font-size: 12px; }
    .inspector-facts { display: flex; flex-wrap: wrap; gap: 6px; }
    .inspector-tabs { display: flex; gap: 8px; align-items: center; }
    .inspector-tab { min-height: 28px; padding: 5px 10px; border-color: rgba(148, 163, 184, .2); background: rgba(15, 23, 42, .72); color: #cbd5e1; font-weight: 800; }
    .inspector-tab.is-active { border-color: rgba(56, 189, 248, .7); background: rgba(56, 189, 248, .14); color: #e0f2fe; }
    .inspector-tab:disabled { cursor: not-allowed; opacity: .45; }
    .inspector-json { max-height: 420px; margin: 0; }
    @media (max-width: 980px) {
      header { align-items: flex-start; flex-wrap: wrap; }
      .actions { width: 100%; margin-left: 0; overflow-x: auto; }
      .service-grid, .queue-lanes { grid-template-columns: 1fr; }
      .log-inspector { right: 8px; bottom: 8px; width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Server 服务日志</h1>
    <span id="connectionStatus" class="status">连接中</span>
    <div class="actions">
      <select id="serviceFilter" aria-label="服务分类">
        <option value="">全部服务</option>
        <option value="frontend_api">Frontend API</option>
        <option value="clip_worker">CLIP Worker</option>
        <option value="bundle_api">Bundle API</option>
        <option value="llm_provider">LLM Provider</option>
        <option value="image_provider">Image Provider</option>
        <option value="sse_broadcast">SSE Broadcast</option>
        <option value="system">System</option>
      </select>
      <button id="pauseButton" type="button">暂停滚动</button>
      <button id="clearButton" type="button">清空显示</button>
      <a href="/">返回工作台</a>
    </div>
  </header>
  <main>
    <section class="queue-panel" aria-live="polite">
      <div class="queue-heading">
        <div>
          <h2>Images Queue</h2>
          <p>本机图片任务队列，只展示执行/等待，不混进接口日志</p>
        </div>
        <div class="queue-heading-meta">
          <span id="queueLiveStatus" class="status">队列连接中</span>
          <span id="queueConcurrency" class="queue-limit">并发 3 / 3</span>
        </div>
      </div>
      <div class="queue-stats">
        <div class="queue-stat"><span>执行中</span><strong id="queueActiveCount">0</strong></div>
        <div class="queue-stat"><span>排队中</span><strong id="queuePendingCount">0</strong></div>
      </div>
      <div class="queue-lanes">
        <section class="queue-lane" data-state="running">
          <div class="queue-lane-heading"><span>执行中</span><span id="queueActiveLabel">0</span></div>
          <div id="queueActiveList" class="queue-task-list"></div>
        </section>
        <section class="queue-lane" data-state="waiting">
          <div class="queue-lane-heading"><span>排队等待</span><span id="queuePendingLabel">0</span></div>
          <div id="queuePendingList" class="queue-task-list"></div>
        </section>
      </div>
    </section>
    <div class="summary">
      <span id="logCount">0 条日志</span>
      <span id="serviceSummary">Frontend API 0 · CLIP 0 · Provider 0</span>
      <span>status 不做主显示；错误只在关键字段里提示</span>
    </div>
    <div id="logList" class="service-grid"></div>
    <aside id="logInspector" class="log-inspector" hidden aria-live="polite">
      <header class="inspector-head">
        <div>
          <h2 id="inspectorTitle" class="inspector-title">日志详情</h2>
          <div id="inspectorSubtitle" class="inspector-subtitle"></div>
        </div>
        <button id="inspectorClose" class="inspector-close" type="button" aria-label="关闭日志详情">×</button>
      </header>
      <div class="inspector-body">
        <div id="inspectorRoute" class="inspector-route"></div>
        <section class="inspector-section">
          <h3>关键字段</h3>
          <div id="inspectorFacts" class="inspector-facts"></div>
        </section>
        <section class="inspector-section">
          <h3>Body</h3>
          <div class="inspector-tabs" role="tablist" aria-label="日志请求响应详情">
            <button id="inspectorRequestTab" class="inspector-tab" type="button" role="tab">Payload</button>
            <button id="inspectorResponseTab" class="inspector-tab" type="button" role="tab">Response</button>
          </div>
          <pre id="inspectorPayload" class="inspector-json"></pre>
        </section>
      </div>
    </aside>
  </main>
  <script>
    var logEntries = [];
    var isPaused = false;
    var logRenderScheduled = false;
    var lastLogEventId = 0;
    var formattedPayloadCache = {};
    var serviceFilter = document.getElementById("serviceFilter");
    var logList = document.getElementById("logList");
    var logCount = document.getElementById("logCount");
    var serviceSummary = document.getElementById("serviceSummary");
    var logInspector = document.getElementById("logInspector");
    var inspectorTitle = document.getElementById("inspectorTitle");
    var inspectorSubtitle = document.getElementById("inspectorSubtitle");
    var inspectorRoute = document.getElementById("inspectorRoute");
    var inspectorFacts = document.getElementById("inspectorFacts");
    var inspectorPayload = document.getElementById("inspectorPayload");
    var inspectorRequestTab = document.getElementById("inspectorRequestTab");
    var inspectorResponseTab = document.getElementById("inspectorResponseTab");
    var inspectorClose = document.getElementById("inspectorClose");
    var pauseButton = document.getElementById("pauseButton");
    var clearButton = document.getElementById("clearButton");
    var connectionStatus = document.getElementById("connectionStatus");
    var queueLiveStatus = document.getElementById("queueLiveStatus");
    var queueConcurrency = document.getElementById("queueConcurrency");
    var queueActiveCount = document.getElementById("queueActiveCount");
    var queuePendingCount = document.getElementById("queuePendingCount");
    var queueActiveLabel = document.getElementById("queueActiveLabel");
    var queuePendingLabel = document.getElementById("queuePendingLabel");
    var queueActiveList = document.getElementById("queueActiveList");
    var queuePendingList = document.getElementById("queuePendingList");
    var serverLogEventSource = null;
    var queuePollTimer = null;
    var inspectorCurrentCall = null;
    var inspectorActivePayloadType = "response";
    var queueState = { concurrency: 3, active: 0, pending: 0, active_tasks: [], pending_tasks: [] };
    var serviceDefinitions = [
      { key: "frontend_api", title: "Frontend API", subtitle: "浏览器/扩展 ↔ 本机 API，重点看 request upload 和 response", accent: "#38bdf8" },
      { key: "clip_worker", title: "CLIP Worker", subtitle: "本机 CLIP 检索 worker，重点看 query、top_k、返回数量和耗时", accent: "#818cf8" },
      { key: "bundle_api", title: "Bundle API", subtitle: "bundle 内部 API 调用，重点看 bundle 请求和返回摘要", accent: "#a78bfa" },
      { key: "llm_provider", title: "LLM Provider", subtitle: "大模型供应商调用，名称泛化，后续换供应商不用改 UI", accent: "#fb7185" },
      { key: "image_provider", title: "Image Provider", subtitle: "图片生成/编辑供应商调用，名称泛化，后续换供应商不用改 UI", accent: "#f97316" },
      { key: "sse_broadcast", title: "SSE Broadcast", subtitle: "本机后端推送到前端的广播事件", accent: "#22c55e" },
      { key: "system", title: "System", subtitle: "启动、异常和无法归类的内部日志", accent: "#94a3b8" }
    ];

    /** Update the visible state of the live SSE connection. */
    function setConnectionStatus(isOnline, text) {
      connectionStatus.className = isOnline ? "status is-online" : "status";
      connectionStatus.textContent = text;
    }

    /** Convert one structured payload into readable JSON text. */
    function formatPayload(payload, cacheKey) {
      if (payload === null || payload === undefined) {
        return "";
      }
      var normalizedKey = cacheKey === undefined || cacheKey === null ? "" : String(cacheKey);
      if (normalizedKey && Object.prototype.hasOwnProperty.call(formattedPayloadCache, normalizedKey)) {
        return formattedPayloadCache[normalizedKey];
      }
      var text = JSON.stringify(payload, null, 2);
      if (normalizedKey) {
        formattedPayloadCache[normalizedKey] = text;
      }
      return text;
    }

    /** Queue one service-log repaint into the next browser frame. */
    function scheduleLogRender() {
      if (isPaused || logRenderScheduled) {
        return;
      }
      logRenderScheduled = true;
      /** Render the latest classified logs after the current event burst. */
      function renderScheduledLogs() {
        logRenderScheduled = false;
        if (!isPaused) {
          renderLogs();
        }
      }
      window.setTimeout(renderScheduledLogs, 80);
    }

    /** Convert a request duration from milliseconds into a seconds label. */
    function formatDurationSeconds(durationMs) {
      var safeDuration = Math.max(0, Number(durationMs) || 0);
      return (safeDuration / 1000).toFixed(2) + "s";
    }

    /** Format one queue timestamp for the compact task card. */
    function formatQueueTime(value) {
      if (!value) {
        return "时间未知";
      }
      var date = new Date(String(value));
      if (!Number.isFinite(date.getTime())) {
        return "时间未知";
      }
      return date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    /** Return a readable label for one edits or generation queue task. */
    function getQueueTaskLabel(task) {
      return String(task && task.type || "image").toLowerCase() === "gen" ? "GEN 生图" : "EDITS 图片编辑";
    }

    /** Create one task card for the active or waiting image queue lane. */
    function createQueueTaskElement(task) {
      var card = document.createElement("article");
      var head = document.createElement("div");
      var type = document.createElement("span");
      var number = document.createElement("span");
      var meta = document.createElement("div");
      var request = document.createElement("span");
      var time = document.createElement("span");
      var state = String(task && task.state || "waiting");
      card.className = "queue-task";
      card.dataset.state = state;
      head.className = "queue-task-head";
      type.className = "queue-task-type";
      type.textContent = getQueueTaskLabel(task);
      number.className = "queue-task-number";
      number.textContent = "#" + String(task && task.id || "-");
      meta.className = "queue-task-meta";
      request.textContent = "请求 " + String(task && task.request_id || "-");
      time.textContent = state === "running" ? "开始 " + formatQueueTime(task && task.started_at) : "进入 " + formatQueueTime(task && task.enqueued_at);
      head.appendChild(type);
      head.appendChild(number);
      meta.appendChild(request);
      meta.appendChild(time);
      card.appendChild(head);
      card.appendChild(meta);
      return card;
    }

    /** Render the active and waiting image queue lanes from the latest snapshot. */
    function renderQueue() {
      var activeTasks = Array.isArray(queueState.active_tasks) ? queueState.active_tasks : [];
      var pendingTasks = Array.isArray(queueState.pending_tasks) ? queueState.pending_tasks : [];
      var concurrency = Math.max(1, Number(queueState.concurrency) || 3);
      queueActiveCount.textContent = String(activeTasks.length);
      queuePendingCount.textContent = String(pendingTasks.length);
      queueActiveLabel.textContent = activeTasks.length + " / " + concurrency;
      queuePendingLabel.textContent = String(pendingTasks.length);
      queueConcurrency.textContent = "并发 " + activeTasks.length + " / " + concurrency;
      queueActiveList.textContent = "";
      queuePendingList.textContent = "";
      for (var activeIndex = 0; activeIndex < activeTasks.length; activeIndex += 1) {
        queueActiveList.appendChild(createQueueTaskElement(activeTasks[activeIndex]));
      }
      for (var pendingIndex = 0; pendingIndex < pendingTasks.length; pendingIndex += 1) {
        queuePendingList.appendChild(createQueueTaskElement(pendingTasks[pendingIndex]));
      }
      if (!activeTasks.length) {
        var activeEmpty = document.createElement("div");
        activeEmpty.className = "queue-task-empty";
        activeEmpty.textContent = "暂无执行任务";
        queueActiveList.appendChild(activeEmpty);
      }
      if (!pendingTasks.length) {
        var pendingEmpty = document.createElement("div");
        pendingEmpty.className = "queue-task-empty";
        pendingEmpty.textContent = "暂无排队任务";
        queuePendingList.appendChild(pendingEmpty);
      }
    }

    /** Apply one queue API or SSE payload to the live queue panel. */
    function applyQueuePayload(payload) {
      var nextState = payload && payload.queue ? payload.queue : payload;
      if (!nextState || typeof nextState !== "object") {
        return;
      }
      queueState = {
        concurrency: Number(nextState.concurrency) || 3,
        active: Number(nextState.active) || 0,
        pending: Number(nextState.pending) || 0,
        active_tasks: Array.isArray(nextState.active_tasks) ? nextState.active_tasks : [],
        pending_tasks: Array.isArray(nextState.pending_tasks) ? nextState.pending_tasks : []
      };
      renderQueue();
    }

    /** Return one service definition by key. */
    function getServiceDefinition(serviceKey) {
      for (var index = 0; index < serviceDefinitions.length; index += 1) {
        if (serviceDefinitions[index].key === serviceKey) {
          return serviceDefinitions[index];
        }
      }
      return serviceDefinitions[serviceDefinitions.length - 1];
    }

    /** Normalize one visible label so provider names stay replaceable in the UI. */
    function getGenericLabel(entry) {
      var label = String(entry && entry.label || "");
      return label.replace(/Kimi/gi, "LLM Provider").replace(/Moonshot/gi, "LLM Provider").replace(/BeeAPI/gi, "Image Provider");
    }

    /** Return the service bucket for one backend log entry. */
    function getEntryServiceKey(entry) {
      var label = String(entry && entry.label || "").toLowerCase();
      var direction = String(entry && entry.direction || "").toUpperCase();
      var flow = String(entry && entry.flow || "");
      var payload = entry && entry.payload && typeof entry.payload === "object" ? entry.payload : {};
      if (direction === "RECEIVE" || direction === "RECEIVE BODY" || direction === "SEND" || flow === "frontend_request" || flow === "backend_response") {
        return "frontend_api";
      }
      if (direction === "BROADCAST" || flow === "backend_broadcast") {
        return "sse_broadcast";
      }
      if (label.indexOf("bundle api") >= 0) {
        return "bundle_api";
      }
      if (label.indexOf("clip worker") >= 0 || label.indexOf("clip workflow") >= 0 || label.indexOf("bundle clip") >= 0) {
        return "clip_worker";
      }
      if (label.indexOf("kimi") >= 0 || label.indexOf("moonshot") >= 0 || String(payload.model || "").toLowerCase().indexOf("kimi") >= 0) {
        return "llm_provider";
      }
      if (label.indexOf("beeapi") >= 0 || label.indexOf("image provider") >= 0 || label.indexOf("provider source image") >= 0 || label.indexOf("detail image") >= 0 || label.indexOf("generation") >= 0 || label.indexOf("fusion") >= 0) {
        return "image_provider";
      }
      return "system";
    }

    /** Return whether one entry has an error-like signal worth highlighting. */
    function isErrorEntry(entry) {
      var label = String(entry && entry.label || "").toLowerCase();
      var payload = entry && entry.payload && typeof entry.payload === "object" ? entry.payload : {};
      var status = Number(payload.status || 0);
      return status >= 400 || label.indexOf("error") >= 0 || label.indexOf("failed") >= 0 || Boolean(payload.error || payload.error_code);
    }

    /** Return whether one entry has a pending or timeout signal worth highlighting. */
    function isWarningEntry(entry) {
      var label = String(entry && entry.label || "").toLowerCase();
      return label.indexOf("timeout") >= 0 || label.indexOf("fallback") >= 0 || label.indexOf("skipped") >= 0;
    }

    /** Read one display target from label and payload without exposing secret values. */
    function getProviderTarget(entry) {
      var payload = entry && entry.payload && typeof entry.payload === "object" ? entry.payload : {};
      var label = String(entry && entry.label || "");
      var methodMatch = /\b(GET|POST|PUT|PATCH|DELETE)\s+([^\s]+)/i.exec(label);
      if (payload.target) {
        return String(payload.target);
      }
      if (payload.url) {
        return String(payload.url);
      }
      if (methodMatch) {
        return methodMatch[1].toUpperCase() + " " + methodMatch[2];
      }
      return getServiceDefinition(getEntryServiceKey(entry)).title;
    }

    /** Return the source and target pair shown in the route line. */
    function getRoutePair(entry) {
      var direction = String(entry && entry.direction || "").toUpperCase();
      var payload = entry && entry.payload && typeof entry.payload === "object" ? entry.payload : {};
      var service = getServiceDefinition(getEntryServiceKey(entry)).title;
      if (payload.source || payload.target) {
        return { from: String(payload.source || "Local Server"), to: String(payload.target || service) };
      }
      if (direction === "OUTBOUND") {
        return { from: "Local Server", to: getProviderTarget(entry) };
      }
      if (direction === "UPSTREAM") {
        return { from: service, to: "Local Server" };
      }
      if (direction === "BROADCAST") {
        return { from: "Local Server", to: "Browser SSE" };
      }
      return { from: "Local Server", to: service };
    }

    /** Add one compact fact pill to the list if it has content. */
    function pushFact(facts, label, value, isError) {
      if (value === undefined || value === null || value === "") {
        return;
      }
      facts.push({ label: label, value: String(value), is_error: Boolean(isError) });
    }

    /** Return key facts for one log card instead of dumping full JSON. */
    function getEntryFacts(entry) {
      var facts = [];
      var payload = entry && entry.payload && typeof entry.payload === "object" ? entry.payload : {};
      var upload = payload.upload && typeof payload.upload === "object" ? payload.upload : {};
      pushFact(facts, "request", entry && entry.request_id);
      pushFact(facts, "duration", payload.duration_ms ? formatDurationSeconds(payload.duration_ms) : "");
      pushFact(facts, "query", payload.query);
      pushFact(facts, "top_k", payload.top_k);
      pushFact(facts, "results", payload.result_count);
      pushFact(facts, "groups", payload.group_count);
      pushFact(facts, "prompts", payload.prompts_searched);
      pushFact(facts, "upload", upload.content_type || upload.body_type);
      pushFact(facts, "fields", upload.fields ? upload.fields.join(",") : "");
      pushFact(facts, "image_bytes", payload.image_bytes);
      pushFact(facts, "image_chars", payload.image_base64_chars);
      pushFact(facts, "code", payload.error_code || payload.code, true);
      pushFact(facts, "error", payload.error, true);
      if (!facts.length) {
        pushFact(facts, "event", String(entry && entry.direction || "INFO"));
      }
      return facts.slice(0, 9);
    }

    /** Create one fact pill element. */
    function createFactElement(fact) {
      var element = document.createElement("span");
      element.className = fact.is_error ? "fact is-error" : "fact";
      element.textContent = fact.label + ": " + fact.value;
      return element;
    }

    /** Create one log call group from its first event. */
    function createLogCall(entry) {
      return {
        service_key: getEntryServiceKey(entry),
        request_id: String(entry && entry.request_id || "-"),
        first_time: String(entry && entry.time || ""),
        last_time: String(entry && entry.time || ""),
        events: [],
        request_entry: null,
        response_entry: null
      };
    }

    /** Add one raw event into a Network-style request/response call group. */
    function addEntryToLogCall(call, entry) {
      var direction = String(entry && entry.direction || "").toUpperCase();
      call.events.push(entry);
      call.last_time = String(entry && entry.time || call.last_time);
      if (direction === "RECEIVE" || direction === "OUTBOUND" || direction === "BROADCAST") {
        call.request_entry = call.request_entry || entry;
      }
      if (direction === "SEND" || direction === "DONE" || direction === "UPSTREAM") {
        call.response_entry = entry;
      }
      if (!call.request_entry && direction === "RECEIVE BODY") {
        call.request_entry = entry;
      }
    }

    /** Return the most useful event for naming one request/response call group. */
    function getCallPrimaryEntry(call) {
      return call && (call.request_entry || call.response_entry || call.events[0]) || {};
    }

    /** Return the combined display label for one call group. */
    function getCallLabel(call) {
      var primary = getCallPrimaryEntry(call);
      return getGenericLabel(primary);
    }

    /** Return whether any event inside one call group has an error signal. */
    function isErrorCall(call) {
      var events = call && Array.isArray(call.events) ? call.events : [];
      for (var index = 0; index < events.length; index += 1) {
        if (isErrorEntry(events[index])) {
          return true;
        }
      }
      return false;
    }

    /** Return whether any event inside one call group has a warning signal. */
    function isWarningCall(call) {
      var events = call && Array.isArray(call.events) ? call.events : [];
      for (var index = 0; index < events.length; index += 1) {
        if (isWarningEntry(events[index])) {
          return true;
        }
      }
      return false;
    }

    /** Return the route shown for a combined request/response call. */
    function getCallRoutePair(call) {
      var primary = getCallPrimaryEntry(call);
      return getRoutePair(primary);
    }

    /** Add one unique fact pill to a combined call summary. */
    function pushUniqueFact(facts, seen, label, value, isError) {
      var key = String(label) + ":" + String(value);
      if (seen[key]) {
        return;
      }
      seen[key] = true;
      pushFact(facts, label, value, isError);
    }

    /** Return key facts from all request/response events in one call group. */
    function getCallFacts(call) {
      var facts = [];
      var seen = {};
      var events = call && Array.isArray(call.events) ? call.events : [];
      pushUniqueFact(facts, seen, "request", call && call.request_id);
      pushUniqueFact(facts, seen, "events", events.length);
      for (var index = 0; index < events.length; index += 1) {
        var entry = events[index] || {};
        var payload = entry.payload && typeof entry.payload === "object" ? entry.payload : {};
        var upload = payload.upload && typeof payload.upload === "object" ? payload.upload : {};
        pushUniqueFact(facts, seen, "duration", payload.duration_ms ? formatDurationSeconds(payload.duration_ms) : "");
        pushUniqueFact(facts, seen, "query", payload.query);
        pushUniqueFact(facts, seen, "top_k", payload.top_k);
        pushUniqueFact(facts, seen, "results", payload.result_count);
        pushUniqueFact(facts, seen, "groups", payload.group_count);
        pushUniqueFact(facts, seen, "prompts", payload.prompts_searched);
        pushUniqueFact(facts, seen, "upload", upload.content_type || upload.body_type);
        pushUniqueFact(facts, seen, "fields", upload.fields ? upload.fields.join(",") : "");
        pushUniqueFact(facts, seen, "image_bytes", payload.image_bytes);
        pushUniqueFact(facts, seen, "image_chars", payload.image_base64_chars);
        pushUniqueFact(facts, seen, "code", payload.error_code || payload.code, true);
        pushUniqueFact(facts, seen, "error", payload.error, true);
      }
      if (!facts.length) {
        pushFact(facts, "event", "req/res");
      }
      return facts.slice(0, 10);
    }

    /** Create one compact service log card. */
    function createLogCard(call) {
      var card = document.createElement("article");
      var top = document.createElement("div");
      var title = document.createElement("div");
      var time = document.createElement("div");
      var route = document.createElement("div");
      var from = document.createElement("div");
      var arrow = document.createElement("div");
      var to = document.createElement("div");
      var facts = document.createElement("div");
      var detailButton = document.createElement("button");
      var pair = getCallRoutePair(call);
      card.className = "log-card";
      if (isErrorCall(call)) {
        card.className += " is-error";
      } else if (isWarningCall(call)) {
        card.className += " is-warning";
      }
      top.className = "log-top";
      title.className = "log-title";
      title.textContent = getCallLabel(call);
      time.className = "log-time";
      time.textContent = String(call && call.last_time || "");
      route.className = "route-line";
      from.className = "route-node";
      from.textContent = pair.from;
      arrow.className = "route-arrow";
      arrow.textContent = "→";
      to.className = "route-node";
      to.textContent = pair.to;
      facts.className = "facts";
      var factList = getCallFacts(call);
      for (var index = 0; index < factList.length; index += 1) {
        facts.appendChild(createFactElement(factList[index]));
      }
      detailButton.className = "detail-button";
      detailButton.type = "button";
      detailButton.textContent = "打开详情";
      detailButton.addEventListener("click", function openSelectedLogDetail(event) {
        event.stopPropagation();
        openLogInspector(call);
      });
      card.addEventListener("dblclick", function openLogDetailFromCard() {
        openLogInspector(call);
      });
      top.appendChild(title);
      top.appendChild(time);
      route.appendChild(from);
      route.appendChild(arrow);
      route.appendChild(to);
      card.appendChild(top);
      card.appendChild(route);
      card.appendChild(facts);
      card.appendChild(detailButton);
      return card;
    }

    /** Render one source-target route inside the Network-style inspector. */
    function renderInspectorRoute(pair) {
      var from = document.createElement("div");
      var arrow = document.createElement("div");
      var to = document.createElement("div");
      inspectorRoute.textContent = "";
      from.className = "route-node";
      from.textContent = pair.from;
      arrow.className = "route-arrow";
      arrow.textContent = "→";
      to.className = "route-node";
      to.textContent = pair.to;
      inspectorRoute.appendChild(from);
      inspectorRoute.appendChild(arrow);
      inspectorRoute.appendChild(to);
    }

    /** Open the large Network-style inspector for one compact log card. */
    function openLogInspector(call) {
      var pair = getCallRoutePair(call);
      var factList = getCallFacts(call);
      inspectorCurrentCall = call;
      inspectorTitle.textContent = getCallLabel(call);
      inspectorSubtitle.textContent = String(call && call.first_time || "") + " → " + String(call && call.last_time || "") + " · request " + String(call && call.request_id || "-");
      renderInspectorRoute(pair);
      inspectorFacts.textContent = "";
      for (var index = 0; index < factList.length; index += 1) {
        inspectorFacts.appendChild(createFactElement(factList[index]));
      }
      setInspectorPayloadType(call && call.response_entry ? "response" : "request");
      logInspector.hidden = false;
    }

    /** Close the large Network-style inspector without clearing current logs. */
    function closeLogInspector() {
      inspectorCurrentCall = null;
      logInspector.hidden = true;
    }

    /** Return the request or response entry selected by the inspector body tabs. */
    function getInspectorPayloadEntry(call, payloadType) {
      if (!call) {
        return null;
      }
      return payloadType === "request" ? call.request_entry : call.response_entry;
    }

    /** Render the currently selected inspector body without mixing request and response. */
    function renderInspectorPayload() {
      var entry = getInspectorPayloadEntry(inspectorCurrentCall, inspectorActivePayloadType);
      var fallback = {
        type: inspectorActivePayloadType,
        message: inspectorActivePayloadType === "request" ? "暂无 Payload" : "暂无 Response",
        events: inspectorCurrentCall && inspectorCurrentCall.events || []
      };
      inspectorPayload.textContent = formatPayload(entry || fallback, "inspector:" + String(inspectorCurrentCall && inspectorCurrentCall.request_id || "") + ":" + inspectorActivePayloadType + ":" + String(inspectorCurrentCall && inspectorCurrentCall.events ? inspectorCurrentCall.events.length : 0));
    }

    /** Switch the inspector body tab and keep disabled tabs visually honest. */
    function setInspectorPayloadType(payloadType) {
      var hasRequest = Boolean(getInspectorPayloadEntry(inspectorCurrentCall, "request"));
      var hasResponse = Boolean(getInspectorPayloadEntry(inspectorCurrentCall, "response"));
      inspectorActivePayloadType = payloadType;
      inspectorRequestTab.disabled = !hasRequest;
      inspectorResponseTab.disabled = !hasResponse;
      inspectorRequestTab.classList.toggle("is-active", inspectorActivePayloadType === "request");
      inspectorResponseTab.classList.toggle("is-active", inspectorActivePayloadType === "response");
      inspectorRequestTab.setAttribute("aria-selected", inspectorActivePayloadType === "request" ? "true" : "false");
      inspectorResponseTab.setAttribute("aria-selected", inspectorActivePayloadType === "response" ? "true" : "false");
      renderInspectorPayload();
    }

    /** Handle the Payload body tab click. */
    function handleInspectorRequestTabClick() {
      setInspectorPayloadType("request");
    }

    /** Handle the Response body tab click. */
    function handleInspectorResponseTabClick() {
      setInspectorPayloadType("response");
    }

    /** Create one service section and append its newest log cards. */
    function createServicePanel(definition, entries) {
      var panel = document.createElement("section");
      var head = document.createElement("div");
      var titleBox = document.createElement("div");
      var title = document.createElement("h2");
      var subtitle = document.createElement("p");
      var count = document.createElement("span");
      var body = document.createElement("div");
      panel.className = "service-panel";
      panel.style.setProperty("--accent", definition.accent);
      panel.dataset.empty = entries.length ? "false" : "true";
      head.className = "service-head";
      title.textContent = definition.title;
      subtitle.textContent = definition.subtitle;
      count.className = "service-count";
      count.textContent = String(entries.length);
      body.className = "service-body";
      titleBox.appendChild(title);
      titleBox.appendChild(subtitle);
      head.appendChild(titleBox);
      head.appendChild(count);
      panel.appendChild(head);
      if (!entries.length) {
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "暂无日志";
        body.appendChild(empty);
      }
      for (var index = entries.length - 1; index >= 0; index -= 1) {
        body.appendChild(createLogCard(entries[index]));
      }
      panel.appendChild(body);
      return panel;
    }

    /** Return the pending-pairing key used to combine request and response logs. */
    function getPendingCallKey(entry) {
      return getEntryServiceKey(entry) + "::" + String(entry && entry.request_id || "-");
    }

    /** Return whether one entry starts a request/response call group. */
    function isCallRequestEntry(entry) {
      var direction = String(entry && entry.direction || "").toUpperCase();
      return direction === "RECEIVE" || direction === "OUTBOUND" || direction === "BROADCAST";
    }

    /** Return whether one entry completes or enriches an existing call group. */
    function isCallResponseEntry(entry) {
      var direction = String(entry && entry.direction || "").toUpperCase();
      return direction === "RECEIVE BODY" || direction === "SEND" || direction === "DONE" || direction === "UPSTREAM";
    }

    /** Find the newest open request call for one response entry. */
    function findPendingCall(pendingCalls, entry) {
      var key = getPendingCallKey(entry);
      var list = pendingCalls[key] || [];
      for (var index = list.length - 1; index >= 0; index -= 1) {
        if (!list[index].response_entry) {
          return list[index];
        }
      }
      return list.length ? list[list.length - 1] : null;
    }

    /** Push one call into the correct service bucket and pending lookup. */
    function registerCall(buckets, pendingCalls, call) {
      var serviceKey = call.service_key;
      if (!buckets[serviceKey]) {
        serviceKey = "system";
        call.service_key = serviceKey;
      }
      buckets[serviceKey].push(call);
      var key = call.service_key + "::" + call.request_id;
      if (!pendingCalls[key]) {
        pendingCalls[key] = [];
      }
      pendingCalls[key].push(call);
    }

    /** Build classified service buckets from combined request/response calls. */
    function buildServiceBuckets() {
      var buckets = {};
      var pendingCalls = {};
      for (var definitionIndex = 0; definitionIndex < serviceDefinitions.length; definitionIndex += 1) {
        buckets[serviceDefinitions[definitionIndex].key] = [];
      }
      for (var entryIndex = 0; entryIndex < logEntries.length; entryIndex += 1) {
        var entry = logEntries[entryIndex] || {};
        var call = null;
        if (isCallResponseEntry(entry)) {
          call = findPendingCall(pendingCalls, entry);
        }
        if (!call) {
          call = createLogCall(entry);
          registerCall(buckets, pendingCalls, call);
        }
        addEntryToLogCall(call, entry);
        if (isCallRequestEntry(entry) && !pendingCalls[getPendingCallKey(entry)]) {
          registerCall(buckets, pendingCalls, call);
        }
      }
      return buckets;
    }

    /** Render service-grouped logs with only the selected service visible. */
    function renderLogs() {
      var selectedService = serviceFilter.value;
      var buckets = buildServiceBuckets();
      var fragment = document.createDocumentFragment();
      var total = 0;
      for (var index = 0; index < serviceDefinitions.length; index += 1) {
        var definition = serviceDefinitions[index];
        var entries = buckets[definition.key] || [];
        total += entries.length;
        if (selectedService && selectedService !== definition.key) {
          continue;
        }
        fragment.appendChild(createServicePanel(definition, entries.slice(-40)));
      }
      logCount.textContent = total + " 条日志";
      serviceSummary.textContent = "Frontend API " + buckets.frontend_api.length + " · CLIP " + buckets.clip_worker.length + " · Bundle " + buckets.bundle_api.length + " · LLM " + buckets.llm_provider.length + " · Image " + buckets.image_provider.length;
      logList.textContent = "";
      logList.appendChild(fragment);
    }

    /** Add one live entry while retaining a bounded browser-side history. */
    function appendLogEntry(entry) {
      var eventId = Number(entry && entry.event_id);
      if (Number.isFinite(eventId) && eventId > 0) {
        if (eventId <= lastLogEventId) {
          return;
        }
        lastLogEventId = eventId;
      }
      logEntries.push(entry);
      if (logEntries.length > 300) {
        logEntries.splice(0, logEntries.length - 300);
      }
      if (!isPaused) {
        scheduleLogRender();
      }
    }

    /** Load the current in-memory server log history. */
    async function loadLogHistory() {
      try {
        var response = await fetch("/api/v1/logs", { cache: "no-store" });
        var payload = await response.json();
        var logData = payload && payload.data && typeof payload.data === "object" ? payload.data : payload;
        logEntries = logData && Array.isArray(logData.logs) ? logData.logs : [];
        lastLogEventId = Number(logData && logData.last_event_id) || 0;
        if (!lastLogEventId) {
          for (var index = 0; index < logEntries.length; index += 1) {
            var eventId = Number(logEntries[index] && logEntries[index].event_id);
            if (Number.isFinite(eventId) && eventId > lastLogEventId) {
              lastLogEventId = eventId;
            }
          }
        }
        renderLogs();
      } catch (error) {
        setConnectionStatus(false, "历史读取失败");
      }
    }

    /** Load the current shared image queue snapshot without retaining another HTTP connection. */
    async function loadQueueState() {
      try {
        var response = await fetch("/api/v1/queue", { cache: "no-store" });
        var payload = await response.json();
        if (!response.ok || !payload || payload.ok === false) {
          throw new Error("队列状态读取失败");
        }
        var queueData = payload && payload.data && typeof payload.data === "object" ? payload.data : payload;
        applyQueuePayload(queueData && queueData.queue ? queueData.queue : queueData);
        queueLiveStatus.className = "status is-online";
        queueLiveStatus.textContent = "队列轮询";
      } catch (error) {
        queueLiveStatus.className = "status";
        queueLiveStatus.textContent = "队列读取失败";
      }
    }

    /** Handle one log message received from the server stream. */
    function handleServerLogMessage(event) {
      try {
        var entry = JSON.parse(event.data);
        if ((!entry.event_id || Number(entry.event_id) <= 0) && event.lastEventId) {
          entry.event_id = Number(event.lastEventId);
        }
        appendLogEntry(entry);
      } catch (error) {
        setConnectionStatus(false, "日志格式错误");
      }
    }

    /** Mark the live log stream as connected. */
    function handleServerLogOpen() {
      setConnectionStatus(true, "实时连接");
    }

    /** Mark the live log stream as reconnecting after a connection error. */
    function handleServerLogError() {
      setConnectionStatus(false, "正在重连");
    }

    /** Connect the page to the server-side live log event stream. */
    function connectServerLogs() {
      if (serverLogEventSource) {
        serverLogEventSource.close();
      }
      serverLogEventSource = new EventSource("/api/v1/logs/events?after=" + encodeURIComponent(String(lastLogEventId)));
      serverLogEventSource.onmessage = handleServerLogMessage;
      serverLogEventSource.onopen = handleServerLogOpen;
      serverLogEventSource.onerror = handleServerLogError;
    }

    /** Refresh the shared image queue periodically without consuming a permanent browser connection. */
    async function pollImageQueue() {
      queuePollTimer = null;
      await loadQueueState();
      queuePollTimer = window.setTimeout(pollImageQueue, 1000);
    }

    /** Release the page-owned live connection and queue timer during navigation. */
    function cleanupLiveConnections() {
      if (serverLogEventSource) {
        serverLogEventSource.close();
        serverLogEventSource = null;
      }
      if (queuePollTimer) {
        window.clearTimeout(queuePollTimer);
        queuePollTimer = null;
      }
    }

    /** Re-render grouped services after the service filter changes. */
    function handleServiceFilterChange() {
      renderLogs();
    }

    /** Toggle live rendering without disconnecting from the server. */
    function handlePauseClick() {
      isPaused = !isPaused;
      pauseButton.textContent = isPaused ? "继续滚动" : "暂停滚动";
      if (!isPaused) {
        renderLogs();
      }
    }

    /** Clear only the current browser display while keeping future logs live. */
    function handleClearClick() {
      logEntries = [];
      formattedPayloadCache = {};
      closeLogInspector();
      renderLogs();
    }

    /** Close the Network-style inspector when Escape is pressed. */
    function handleInspectorKeydown(event) {
      if (event && event.key === "Escape") {
        closeLogInspector();
      }
    }

    /** Load history first and then connect the live grouped service stream. */
    async function initializeLogPage() {
      await loadLogHistory();
      await loadQueueState();
      connectServerLogs();
      queuePollTimer = window.setTimeout(pollImageQueue, 1000);
    }

    serviceFilter.addEventListener("change", handleServiceFilterChange);
    pauseButton.addEventListener("click", handlePauseClick);
    clearButton.addEventListener("click", handleClearClick);
    inspectorClose.addEventListener("click", closeLogInspector);
    inspectorRequestTab.addEventListener("click", handleInspectorRequestTabClick);
    inspectorResponseTab.addEventListener("click", handleInspectorResponseTabClick);
    window.addEventListener("keydown", handleInspectorKeydown);
    window.addEventListener("load", initializeLogPage);
    window.addEventListener("beforeunload", cleanupLiveConnections);
  </script>
</body>
</html>
