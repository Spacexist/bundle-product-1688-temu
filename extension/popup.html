<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自动组货采集器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <div class="popup-actions">
        <button id="jsonExportButton" type="button">导出 JSON</button>
        <button id="clearBatchButton" class="danger" type="button">清空扩展 cache</button>
      </div>
      <div class="batch-info">扩展 cache：<span id="batchCount">0</span> 个商品</div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
