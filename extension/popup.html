<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temu + 1688 统一采集</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="popup-brand">
        <span>T+8</span>
        <div><h1>统一采集</h1><small>Temu + 1688 工作台</small></div>
      </header>
      <p class="hint">先运行 npm run dev，再在 Temu 或 1688 商品详情页点击采集；所有数据统一写入 cache。</p>
      <button id="collectButton" type="button">采集当前商品</button>
      <button id="renderButton" class="secondary" type="button">打开实时渲染</button>
      <button id="jsonExportButton" class="secondary" type="button">导出统一 JSON</button>
      <button id="batchExportButton" class="secondary" type="button">导出统一 Excel</button>
      <button id="clearBatchButton" class="danger" type="button">清空统一批次</button>
      <div class="batch-info">当前批次：<span id="batchCount">0</span> 个商品</div>
      <div id="status" class="status" role="status">等待操作</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
